<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Campus Pulse | Track Complaint</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='track.css') }}"
    >

</head>


<body>

    <main class="track-page">

        <section class="track-card">


            <a
                href="/"
                class="back-link"
            >
                ← Back to Complaint Centre
            </a>


            <div class="brand-mark">
                CP
            </div>


            <p class="eyebrow">
                CAMPUS PULSE
            </p>


            <h1>
                Track Your Complaint
            </h1>


            <p class="subtitle">
                Enter your university roll number to view
                your complaint status and progress.
            </p>


            <!-- SEARCH -->

            <div class="search-box">

                <input
                    type="text"
                    id="rollNo"
                    placeholder="Enter university roll number"
                >

                <button
                    type="button"
                    id="searchBtn"
                >
                    Track Complaint
                </button>

            </div>


            <!-- ERROR / MESSAGE -->

            <div
                id="message"
                class="message"
            ></div>


            <!-- RESULT -->

            <div
                id="complaintResult"
                class="complaint-result"
            >

                <div class="result-header">

                    <h2>
                        Complaint Status
                    </h2>

                    <span
                        id="complaintId"
                        class="complaint-id"
                    >
                    </span>

                </div>


                <!-- STATUS -->

                <div class="status-track">

                    <div
                        id="statusPending"
                        class="status-step"
                    >
                        Pending
                    </div>

                    <div
                        id="statusProgress"
                        class="status-step"
                    >
                        In Progress
                    </div>

                    <div
                        id="statusResolved"
                        class="status-step"
                    >
                        Resolved
                    </div>

                </div>


                <!-- DETAILS -->

                <div class="details-grid">


                    <div class="detail">

                        <span>
                            Issue
                        </span>

                        <strong id="issue">
                            —
                        </strong>

                    </div>


                    <div class="detail">

                        <span>
                            Category
                        </span>

                        <strong id="category">
                            —
                        </strong>

                    </div>


                    <div class="detail">

                        <span>
                            Department
                        </span>

                        <strong id="department">
                            —
                        </strong>

                    </div>


                    <div class="detail">

                        <span>
                            Location
                        </span>

                        <strong id="location">
                            —
                        </strong>

                    </div>


                    <div class="detail">

                        <span>
                            Priority
                        </span>

                        <strong id="priority">
                            —
                        </strong>

                    </div>


                    <div class="detail">

                        <span>
                            Last Updated
                        </span>

                        <strong id="updatedAt">
                            —
                        </strong>

                    </div>


                </div>


                <!-- RECOMMENDATION -->

                <div class="recommendation">

                    <span>
                        RECOMMENDED ACTION
                    </span>

                    <p id="recommendationText">
                        —
                    </p>

                </div>


            </div>

        </section>

    </main>


    <script
        src="{{ url_for('static', filename='track.js') }}"
    ></script>

</body>

</html>
